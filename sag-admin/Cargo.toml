[package]
name = "sag-admin"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Admin REST API CRUD handlers for SAG"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
indexmap = { workspace = true }
sag-core = { path = "../sag-core" }
sag-config = { path = "../sag-config" }
sag-providers = { path = "../sag-providers" }
sag-analytics = { path = "../sag-analytics" }
sag-state = { path = "../sag-state" }
# `target_capabilities` (the protocol capability matrix) is owned by the
# dispatch pre-check; the admin provider list mirrors it verbatim.
sag-dispatch = { path = "../sag-dispatch" }

[dev-dependencies]
http-body-util = { workspace = true }
toml = { workspace = true }

[build]
jobs = 18
incremental = true

[profile.dev]
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.test]
opt-level = 0
debug = 0
incremental = true

[profile.test.package."*"]
opt-level = 0

# Release size tuning lives in the root `Cargo.toml` (`codegen-units = 1`,
# `lto = "thin"`, `strip = "symbols"`). Never set `codegen-units` here: cargo
# config wins over the manifest and would silently disable that tuning.
[profile.release]
lto = "thin"

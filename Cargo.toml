[workspace]
members = [
  "sag-core",
  "sag-config",
  "sag-providers",
  "sag-router",
  "sag-analytics",
  "sag-gateway",
  "sag-dispatch",
  "sag-admin",
  "sag-state",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = ""

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
toml = { version = "1.1.2", features = ["preserve_order"] }
toml-edit = { version = "0.24", features = ["serde"], package = "toml_edit" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "chrono",
] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
notify = { version = "8" }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
http-body-util = "0.1"
fastrand = "2"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "migrate",
] }
rust-embed = "8"
mime_guess = "2"
tracing-appender = "0.2"
url = "2"
home = "0.5"

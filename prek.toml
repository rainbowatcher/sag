# prek(pre-commit 的 Rust 重写,https://prek.j178.dev/)配置
default_install_hook_types = ["pre-commit"]
fail_fast = false

[[repos]]
repo = "local"

  [[repos.hooks]]
  id = "sag-ui-lint-staged"
  name = "Run oxfmt and oxlint on sag-ui staged files"
  # cd 失败兜底(|| exit 1)与原 husky 脚本中的 cd "$SAG_UI_DIR" || exit 1 行为一致
  entry = "pnpm -C sag-ui exec lint-staged"
  language = "system"
  pass_filenames = false
  files = "^sag-ui/"

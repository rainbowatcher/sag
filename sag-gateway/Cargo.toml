[package]
name = "sag-gateway"
version.workspace = true
edition = "2024"
description = "SAG — Smart AI Gateway (binary entry point)"

[[bin]]
name = "sag"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
sag-core = { path = "../sag-core" }
sag-config = { path = "../sag-config" }
sag-router = { path = "../sag-router" }
sag-providers = { path = "../sag-providers" }
sag-analytics = { path = "../sag-analytics" }
sag-state = { path = "../sag-state" }
async-trait = { workspace = true }

# Optional deps for the `embed-ui` feature (see [features] below).
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
# Optional: build the JSON 404 body for unregistered API namespaces.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Test-only: construct AnalyticsEvent fixtures (timestamps / ids) through
# the formal public API instead of raw SQL.
chrono = { workspace = true }
uuid = { workspace = true }
# Test-only: assert on the raw `call_logs` / `sqlite_master` state that the
# rotation scheduler produces (the crate has no other SQL surface).
sqlx = { workspace = true }

[features]
# When on, sag-ui/dist/ is rolled into the binary at compile time.
# Default is OFF: keeps the binary lean for users who deploy the SPA
# separately via Vite or a CDN. The test-env launcher (`just build-test`)
# is the canonical caller for this feature.
embed-ui = ["dep:rust-embed", "dep:mime_guess", "dep:serde_json"]

# ============================================================
# SAG — Smart AI Gateway Configuration
# Copy this to gateway.toml and fill in your keys.
# ============================================================

# FillFirst shuffle cache TTL in seconds. The shuffled target order is
# re-randomised after this many seconds. Set to 0 to never expire (only
# re-shuffle on config reload). Default: 7200 (2 hours).
# shuffle_cache_ttl_secs = 7200

# Logging configuration (optional, defaults below).
# The RUST_LOG environment variable, if set, takes precedence over level.
[logging]
# Log level or EnvFilter directive (e.g. "info", "debug", "info,sag_router=debug").
# Default: "info".
level = "info"
# Output format: "compact" (human-readable) or "json" (structured).
# Default: "compact".
format = "compact"

# Exponential-backoff settings for retry delays. Each retry sleeps for
# `min(base_ms * 2^attempt, max_ms)` with optional full jitter (random(0, cap)).
# Override per deployment to trade off latency vs. upstream load.
[backoff]
# Global default retry count (per target). Can be overridden per-route or per-target.
# Default: 2 (one initial attempt + one retry).
retries = 2
# Initial backoff delay in milliseconds (attempt 0). Default: 100.
base_ms = 100
# Maximum backoff delay cap in milliseconds. Default: 5000 (5s).
max_ms = 5000
# Whether to apply full jitter to each delay. When true, the actual sleep is
# random(0, computed) which avoids thundering-herd retries across concurrent
# clients. Set to false for deterministic delays (useful for testing).
# Default: true.
jitter = true

# Circuit breaker cooldown durations by error category (seconds).
# Omitted keys use the defaults shown below.
[circuit_breaker]
# Cooldown after quota/billing exhaustion (HTTP 429 with quota keywords).
# Default: 3600 (1 hour).
# quota_exhausted_secs = 3600
# Cooldown after a plain rate-limit 429 (non-quota). Default: 10.
# rate_limited_secs = 10
# Cooldown for generic retryable failures (5xx / timeout / network). Default: 60.
# generic_secs = 60

[server]
host = "0.0.0.0"
port = 37210

[analytics]
enabled = true
storage_dsn = "sqlite://analytics.db"

# Gateway client authentication (optional — remove the block to disable)
[gateway_auth]
api_keys = [
    "sag-key-1",
    "sag-key-2",
]

# ============================================================
# LLM Provider configurations
# ============================================================

[providers.openai]
api_keys = ["sk-your-openai-api-key"]
base_url = "https://api.openai.com/v1"
timeout_secs = 120
# 角色映射：将不支持的角色映射为兼容角色
# role_mappings = { "developer" = "system" }

[providers.anthropic]
api_keys = ["sk-ant-your-anthropic-api-key"]
base_url = "https://api.anthropic.com/v1"
timeout_secs = 120
# 角色映射：将不支持的角色映射为兼容角色
# role_mappings = { "developer" = "system" }

# Custom headers override or add to the default request headers.
# [providers.my-custom.headers]
# x-api-key = "override-key"
# x-custom-header = "value"

# Body overrides merge into the upstream JSON request body at the top level.
# Useful for setting provider-specific parameters or overriding defaults.
# [providers.my-custom.body_overrides]
# max_tokens = 4096
# temperature = 0.8

# ============================================================
# Model routing table
# Requested model -> [provider targets sorted by priority descending]
# ============================================================

[[routes]]
model_name = "gpt-4o"
targets = [
    { provider = "openai", real_model = "gpt-4o", priority = 10 },
]

# Per-target extra fields override provider body_overrides for this target.
# Example: { provider = "openai", extra = { temperature = 0.7, max_tokens = 4096 } }

[[routes]]
model_name = "gpt-4o-mini"
targets = [
    { provider = "openai", real_model = "gpt-4o-mini", priority = 10 },
]

# Route-level retries override: retry each target up to 3 times
[[routes]]
model_name = "claude-sonnet"
retries = 3
targets = [
    # Per-target retries override: retry this target up to 5 times
    { provider = "anthropic", real_model = "claude-3-5-sonnet-20241022", priority = 10, retries = 5 },
    # Fallback: if Anthropic fails, try OpenAI with gpt-4o-mini (uses route-level retries=3)
    { provider = "openai", real_model = "gpt-4o-mini", priority = 1 },
]

[[routes]]
model_name = "claude-opus"
targets = [
    { provider = "anthropic", real_model = "claude-3-opus-20240229", priority = 10 },
]

# Catch-all: any model not listed above will be forwarded directly to OpenAI
[[routes]]
model_name = "*"
targets = [
    { provider = "openai", real_model = "<passthrough>", priority = 10 },
]

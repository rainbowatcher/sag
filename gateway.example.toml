# ============================================================
# SAG — Smart AI Gateway Configuration
# Copy this to gateway.toml and fill in your keys.
# ============================================================

# FillFirst shuffle cache TTL in seconds. The shuffled target order is
# re-randomised after this many seconds. Set to 0 to never expire (only
# re-shuffle on config reload). Default: 7200 (2 hours).
# shuffle_cache_ttl_secs = 7200

# Sticky-failover active target reset timeout in seconds. After this many
# seconds the active target expires and routing falls back to the normal
# fill-first order. Set to 0 to never expire. Default: 7200 (2 hours).
# sticky_failover_reset_secs = 7200

# Optional global HTTP/HTTPS proxy URL, used as the default upstream proxy for
# all providers. Only http:// and https:// URLs are supported (no SOCKS).
# SAG never reads system proxy env vars (HTTP_PROXY / HTTPS_PROXY / ALL_PROXY),
# so leaving this unset always means direct connections unless a provider sets
# proxy_mode = "enabled". URLs must not embed credentials (user:pass@).
# Example: proxy_url = "http://proxy.example.com:8080"

# Logging configuration (optional, defaults below).
# The RUST_LOG environment variable, if set, takes precedence over level.
[logging]
# Log level or EnvFilter directive (e.g. "info", "debug", "info,sag_router=debug").
# Default: "info".
level = "info"
# Output format: "compact" (human-readable) or "json" (structured).
# Default: "compact".
format = "compact"

# Exponential-backoff settings for retry delays. Each retry sleeps for
# `min(base_ms * 2^attempt, max_ms)` with optional full jitter (random(0, cap)).
# Override per deployment to trade off latency vs. upstream load.
[backoff]
# Global default retry count (per target). Can be overridden per-route or per-target.
# Default: 2 (one initial attempt + one retry).
retries = 2
# Initial backoff delay in milliseconds (attempt 0). Default: 100.
base_ms = 100
# Maximum backoff delay cap in milliseconds. Default: 5000 (5s).
max_ms = 5000
# Whether to apply full jitter to each delay. When true, the actual sleep is
# random(0, computed) which avoids thundering-herd retries across concurrent
# clients. Set to false for deterministic delays (useful for testing).
# Default: true.
jitter = true

# Circuit breaker cooldown durations by error category (seconds).
# Omitted keys use the defaults shown below.
[circuit_breaker]
# Cooldown after quota/billing exhaustion (HTTP 429 with quota keywords).
# Default: 3600 (1 hour).
# quota_exhausted_secs = 3600
# Cooldown after a plain rate-limit 429 (non-quota). Default: 10.
# rate_limited_secs = 10
# Cooldown for generic retryable failures (5xx / timeout / network). Default: 60.
# generic_secs = 60

[server]
host = "0.0.0.0"
port = 37210

[analytics]
enabled = true
# Relative `sqlite://` paths are anchored at the XDG data dir
# ($XDG_DATA_HOME/sag, default ~/.local/share/sag) — this DSN therefore
# resolves to ~/.local/share/sag/analytics.db without an absolute path in
# the config. Use an absolute path (sqlite:///path/to/db) or ":memory:"
# to opt out.
storage_dsn = "sqlite://analytics.db"
call_log_retention_days = 90   # call_logs 热窗口保留天数；0 = 禁用归档清理（不是"保留 0 天"）

# Gateway client authentication (optional — remove the block to disable)
[gateway_auth]
api_keys = [
    "sag-key-1",
    "sag-key-2",
]

# ============================================================
# LLM Provider configurations
# Provider = credentials + a catalog of protocol APIs ([providers.<name>.apis.<key>]).
# There is NO provider-level base_url — the address lives in each apis section.
# ============================================================

[providers.openai]
api_keys = ["sk-your-openai-api-key"]
timeout_secs = 120
# Fallback protocol (encoding target on the translated path). Optional when
# `apis` declares exactly one protocol key; REQUIRED when it declares several.
fallback = "chat_completions"
# 角色映射：将不支持的角色映射为兼容角色（provider 级缺省；apis.<key> 可整段覆盖）
# role_mappings = { "developer" = "system" }
# Per-provider proxy mode (default: "inherit" — use the top-level proxy_url):
#   "inherit"  — use top-level proxy_url if set, else direct
#   "enabled"  — force top-level proxy_url (config error if none is set)
#   "disabled" — force direct connection, ignoring any top-level proxy
# proxy_mode = "inherit"

# The protocol set = the protocol keys of `apis` (image is a non-protocol
# entry). lane is derived automatically: ingress ∈ protocol keys → Native,
# otherwise Translated through `fallback`.
#
# Admin "fetch models" / model tests probe exactly ONE section: the
# `fallback` protocol when set, else chat_completions, else the next
# protocol key (responses → anthropic_messages) — never the image section.
# The admin UI can switch the probe section per provider; the choice is
# per-request only and never persisted.
[providers.openai.apis.chat_completions]
base_url = "https://api.openai.com/v1"

# Same-origin multi-protocol: each section carries its own base_url.
# Remove this section if you only need chat_completions (then `fallback`
# above becomes optional).
[providers.openai.apis.responses]
base_url = "https://api.openai.com/v1"
# Relative to this section's base_url; used only by admin fetch-models.
models_endpoint = "/models"

[providers.anthropic]
api_keys = ["sk-ant-your-anthropic-api-key"]
timeout_secs = 120
# 角色映射：将不支持的角色映射为兼容角色
# role_mappings = { "developer" = "system" }

# Single protocol key → no `fallback` needed; /v1/messages ingress is
# Native, other ingresses translate down to anthropic_messages.
[providers.anthropic.apis.anthropic_messages]
base_url = "https://api.anthropic.com/v1"
models_endpoint = "/models"

# Image is a non-protocol catalog entry (never part of lane matching).
# The upstream URL = this base_url + the route's api_endpoint.
# [providers.my-image.apis.image]
# base_url = "https://api.openai.com/v1"

# Custom headers override or add to the default request headers.
# [providers.my-custom.headers]
# x-api-key = "override-key"
# x-custom-header = "value"

# Body overrides merge into the upstream JSON request body at the top level.
# Applied to ALL requests for this provider. Use model_overrides for per-model overrides.
# [providers.my-custom.body_overrides]
# max_tokens = 4096
# temperature = 0.8

# Model overrides apply per real_model name, avoiding repeated extra configs across routes.
# Priority: body_overrides < model_overrides < RouteTarget.extra
# [providers.my-custom.model_overrides]
# gpt-4o = { temperature = 0.7, max_tokens = 4096 }
# gpt-4o-mini = { max_tokens = 2048 }

# ============================================================
# Model routing table
# Requested model -> [provider targets sorted by priority descending]
# ============================================================

[[routes]]
model_name = "gpt-4o"
targets = [
    { provider = "openai", real_model = "gpt-4o", priority = 10 },
]

# Per-target extra fields have the highest priority among body overrides.
# Use it for route-level tweaks; for model-level defaults prefer model_overrides.
# Example: { provider = "openai", extra = { temperature = 0.7, max_tokens = 4096 } }
#
# Per-target capability overrides (optional):
#   capabilities — fixed-key capability override. Allowed keys:
#                  streaming, reasoning, tools, images, documents,
#                  stateful, hosted_tools, background. Unknown keys
#                  fail config validation (admin API → 400).
# Example:
#   { provider = "openai", real_model = "gpt-4o", priority = 10,
#     capabilities = { streaming = true, tools = false } }
#
# Image routes are a different species — they must declare the pipeline and
# carry the real upstream path (appended to the provider's apis.image base_url):
# [[routes]]
# model_name = "gpt-image-2"
# pipeline = "image"
# api_endpoint = "/images/generations"
# targets = [{ provider = "my-image" }]
#
# Session-sticky routing (`strategy = "session_sticky"`): a request carrying a
# session identity (conversation_id / prompt_cache_key / first-user-message
# hash) sticks to the target that last served the session successfully.
# Requests without a session identity — and the first request of a session —
# are ordered by a weighted-random permutation where `priority` doubles as the
# weight (higher = more likely to be drawn first; no priority layers here).
# [[routes]]
# model_name = "claude-sonnet-sticky"
# strategy = "session_sticky"
# session_ttl_secs = 3600       # optional, default 3600; 0 = pins never expire
# session_max_entries = 10000   # optional, default 10000 (LRU per route)
# targets = [
#     { provider = "anthropic", real_model = "claude-3-5-sonnet-20241022", priority = 2 },
#     { provider = "openai", real_model = "gpt-4o-mini", priority = 1 },
# ]

[[routes]]
model_name = "gpt-4o-mini"
targets = [
    { provider = "openai", real_model = "gpt-4o-mini", priority = 10 },
]

# Route-level retries override: retry each target up to 3 times
[[routes]]
model_name = "claude-sonnet"
retries = 3
targets = [
    # Per-target retries override: retry this target up to 5 times
    { provider = "anthropic", real_model = "claude-3-5-sonnet-20241022", priority = 10, retries = 5 },
    # Fallback: if Anthropic fails, try OpenAI with gpt-4o-mini (uses route-level retries=3)
    { provider = "openai", real_model = "gpt-4o-mini", priority = 1 },
]

[[routes]]
model_name = "claude-opus"
targets = [
    { provider = "anthropic", real_model = "claude-3-opus-20240229", priority = 10 },
]

# Catch-all: any model not listed above will be forwarded directly to OpenAI
[[routes]]
model_name = "*"
targets = [
    { provider = "openai", real_model = "<passthrough>", priority = 10 },
]

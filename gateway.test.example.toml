# ============================================================
# SAG — Test Environment Configuration
#
# Copy to gateway.test.toml (gitignored) and fill in keys.
# Differences from gateway.example.toml:
#   - port 37211 (drifts away from dev port 37210)
#   - host bound to 127.0.0.1 (loopback only — agent tools are local)
#   - analytics storage_dsn points at analytics-test.db (parallel to dev)
#
# Hot-reload is in-process: editing routes / providers takes effect without
# restart, but [server].port / [server].host changes do NOT rebind the
# listen socket — restart test-env to pick those up.
#
# This template deliberately omits [gateway_auth] — agent tools default to
# no Authorization header. If you want to exercise the auth path, copy
# the [gateway_auth] block from gateway.example.toml after first-time setup.
# ============================================================

# FillFirst shuffle cache TTL in seconds. The shuffled target order is
# re-randomised after this many seconds. Set to 0 to never expire (only
# re-shuffle on config reload). Default: 7200 (2 hours).
# shuffle_cache_ttl_secs = 7200

# Sticky-failover active target reset timeout in seconds. After this many
# seconds the active target expires and routing falls back to the normal
# fill-first order. Set to 0 to never expire. Default: 7200 (2 hours).
# sticky_failover_reset_secs = 7200

# Optional global HTTP/HTTPS proxy URL, used as the default upstream proxy for
# all providers. Only http:// and https:// URLs are supported (no SOCKS).
# SAG never reads system proxy env vars (HTTP_PROXY / HTTPS_PROXY / ALL_PROXY),
# so leaving this unset always means direct connections unless a provider sets
# proxy_mode = "enabled". URLs must not embed credentials (user:pass@).
# Example: proxy_url = "http://proxy.example.com:8080"

# Circuit breaker cooldown durations by error category (seconds).
# Omitted keys use the defaults shown below.
# [circuit_breaker]
# quota_exhausted_secs = 3600
# rate_limited_secs = 10
# generic_secs = 60

# Logging configuration (optional, defaults below).
# The RUST_LOG environment variable, if set, takes precedence over level.
[logging]
# Log level or EnvFilter directive (e.g. "info", "debug", "info,sag_router=debug").
# Default: "info".
level = "info"
# Output format: "compact" (human-readable) or "json" (structured).
# Default: "compact".
format = "compact"

# Exponential-backoff settings for retry delays. See gateway.example.toml
# for full semantics; defaults preserved here for parity with prod.
[backoff]
# Global default retry count (per target). Can be overridden per-route or per-target.
# Default: 2 (one initial attempt + one retry).
retries = 2
base_ms = 100
max_ms = 5000
jitter = true

[server]
host = "127.0.0.1"
port = 37211

[analytics]
enabled = true
storage_dsn = "sqlite://analytics-test.db"

# NOTE: [gateway_auth] intentionally NOT included — agent tools
# (`.kilo/`, `.cline/`, `.kimchi/`) typically connect without Authorization.
# Copy the block from gateway.example.toml after first fill-in if needed.

# ============================================================
# LLM Provider configurations
# Same set as gateway.example.toml; operators override keys per environment.
# ============================================================

[providers.openai]
api_keys = ["sk-your-openai-api-key"]
base_url = "https://api.openai.com/v1"
timeout_secs = 120
# Per-provider proxy mode (default: "inherit" — use the top-level proxy_url):
#   "inherit"  — use top-level proxy_url if set, else direct
#   "enabled"  — force top-level proxy_url (config error if none is set)
#   "disabled" — force direct connection, ignoring any top-level proxy
# proxy_mode = "inherit"

# Fields to strip from the upstream request body before forwarding.
# Use for fields the upstream rejects with strict schema validation
# (e.g. vLLM-specific `chat_template_kwargs` sent to OpenAI-compatible providers).
# strip_fields = ["chat_template_kwargs"]

[providers.anthropic]
api_keys = ["sk-ant-your-anthropic-api-key"]
base_url = "https://api.anthropic.com/v1"
timeout_secs = 120

# ============================================================
# Model routing table — identical structure to prod.
# ============================================================

[[routes]]
model_name = "gpt-4o"
targets = [
    { provider = "openai", real_model = "gpt-4o", priority = 10 },
]

[[routes]]
model_name = "gpt-4o-mini"
targets = [
    { provider = "openai", real_model = "gpt-4o-mini", priority = 10 },
]

[[routes]]
model_name = "claude-sonnet"
retries = 3
targets = [
    { provider = "anthropic", real_model = "claude-3-5-sonnet-20241022", priority = 10, retries = 5 },
    { provider = "openai", real_model = "gpt-4o-mini", priority = 1 },
]

[[routes]]
model_name = "claude-opus"
targets = [
    { provider = "anthropic", real_model = "claude-3-opus-20240229", priority = 10 },
]

[[routes]]
model_name = "*"
targets = [
    { provider = "openai", real_model = "<passthrough>", priority = 10 },
]

# ============================================================
# Q4 STUB — Agent-tool connection (operator fills per environment)
# ============================================================
# After the operator copies this template to gateway.test.toml, fill in the
# `api_keys` placeholder values above (and any [providers.*].base_url overrides
# you need for the upstream you're testing against) — values come from each
# agent tool's local config:
#
#   - .kilo/   : agent's provider base_url & api_key
#   - .cline/  : ditto
#   - .kimchi/ : ditto
#
# Then point the agent at:  http://127.0.0.1:37211/v1
# Tools will call /v1/chat/completions against this gateway without
# Authorization by default (matches the no-[gateway_auth] decision above).

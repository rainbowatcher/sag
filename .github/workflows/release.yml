name: Release

# 打 tag（v*）即发布：先跑 Rust 测试，再在 Apple Silicon runner 上构建内嵌 UI 的
# 单二进制，最后创建 GitHub Release 并把 tarball 的版本 / URL / sha256 写回
# rainbowatcher/homebrew-tap。仅由 tag 触发，无需手动 dispatch。
on:
  push:
    tags: ["v*"]

# 创建 Release（softprops/action-gh-release）与写 homebrew-tap（GitHub Contents
# API）都需要写权限。
permissions:
  contents: write

# 同一 ref 重复推送时串行执行，避免并发创建 release / 并发写 tap 产生竞态。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    # 固定 ubuntu-24.04：ubuntu-latest 正迁移到 24.04 之后的镜像，锁定以保可复现。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml 已固定 channel（1.98），runner 自带 rustup 会自动
      # 安装该工具链，无需任何显式的 toolchain action。
      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        # 与 `just test-rust` 对齐：仓库没有 doc test，只跑单元 / 集成测试。
        run: cargo test --no-fail-fast --tests

  build:
    name: Build aarch64-apple-darwin
    needs: test
    # macos-26 是原生 arm64（Apple Silicon）runner（macos-14 已废弃，
    # 2026-11-02 退役）。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Verify crate version matches tag
        run: |
          set -euo pipefail
          crate_ver="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml [workspace.package] version = ${crate_ver}"
          echo "tag version                            = ${tag_ver}"
          if [ -z "${crate_ver}" ]; then
            echo "::error::could not extract version from Cargo.toml [workspace.package]"
            exit 1
          fi
          if [ "${crate_ver}" != "${tag_ver}" ]; then
            echo "::error::version mismatch: tag ${GITHUB_REF_NAME} (=> ${tag_ver}) != Cargo.toml [workspace.package] ${crate_ver}. Run the version bump before tagging."
            exit 1
          fi
          echo "VERSION=${crate_ver}" >> "$GITHUB_ENV"

      # pnpm 版本与 mise.toml（pnpm = "11"）保持一致；sag-ui/package.json 没有
      # packageManager 字段，故显式指定。
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sag-ui/pnpm-lock.yaml

      - name: Build UI
        run: |
          set -euo pipefail
          # sag-ui/pnpm-lock.yaml 已提交，用 --frozen-lockfile 锁定依赖版本。
          pnpm -C sag-ui install --frozen-lockfile
          pnpm -C sag-ui run build

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary (embed-ui)
        # 根 Cargo.toml 是虚拟 workspace，必须用 -p sag-gateway 指定二进制 crate；
        # embed-ui 把上一步产出的 sag-ui/dist/ 在编译期内嵌。
        run: cargo build --release -p sag-gateway --features embed-ui

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          name="sag-v${VERSION}-aarch64-apple-darwin.tar.gz"
          mkdir -p dist staging
          cp target/release/sag staging/sag
          # tarball 根目录只放 sag 二进制（-C staging sag）。
          tar -czf "dist/${name}" -C staging sag
          # shasum 输出 "digest  filename" 格式；publish 侧用 awk 取第一列，
          # 与 formula 里只填 hex digest 的 sha256 行保持一致。
          ( cd dist && shasum -a 256 "${name}" > "${name}.sha256" )
          ls -l dist
          cat "dist/${name}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish release + homebrew-tap
    needs: build
    # 固定 ubuntu-24.04：ubuntu-latest 正迁移到 24.04 之后的镜像，锁定以保可复现。
    runs-on: ubuntu-24.04
    env:
      # tap 的 Contents API 调用走 TAP_TOKEN（见下方 python 步骤）。
      TAP_TOKEN: ${{ secrets.TAP_RELEASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Read version + checksum from artifact
        # 版本一致性已由 build job 的 "Verify crate version matches tag" 门禁；
        # 这里以「tag 版本对应的 artifact 是否存在」作为最终一致性信号。
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#v}"
          sha_file="dist/sag-v${tag_ver}-aarch64-apple-darwin.tar.gz.sha256"
          if [ ! -f "${sha_file}" ]; then
            echo "::error::missing ${sha_file} — tag ${GITHUB_REF_NAME} (=> ${tag_ver}) does not match the built artifact version"
            exit 1
          fi
          sha="$(awk '{print $1}' "${sha_file}")"
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::unexpected sha256 digest in ${sha_file}: '${sha}'"
            exit 1
          fi
          echo "VERSION=${tag_ver}" >> "$GITHUB_ENV"
          echo "SHA256=${sha}" >> "$GITHUB_ENV"

      # v3 的 overwrite_files 默认为 true：重复推送同一 tag 时会更新已存在的
      # release 并覆盖上传同名资产，不会重复创建，因此无需手写
      # `gh release view` / `gh release upload --clobber` 的幂等分支。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: sag ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

      # tap 更新完全走 GitHub Contents API，不 clone tap 仓库：
      #   - GET  Formula/sag.rb（Bearer TAP_TOKEN）
      #   - 404（tap 还是空仓库 / 首次发布）→ 用完整模板渲染后新建
      #   - 200 → 只精确替换 version 行、url 里的版本段、sha256 行，其余
      #     tap 侧维护的内容原样保留，并用返回的 sha 做乐观锁
      #   - PUT 写回（message: `sag <version>`）
      # 任何非预期状态码都会打印错误并以非零码退出（fail loudly）。
      - name: Update homebrew-tap formula
        env:
          TAP_REPO: rainbowatcher/homebrew-tap
          TAP_PATH: Formula/sag.rb
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          API = (
              f"https://api.github.com/repos/{os.environ['TAP_REPO']}"
              f"/contents/{os.environ['TAP_PATH']}"
          )
          TOKEN = os.environ["TAP_TOKEN"]
          VERSION = os.environ["VERSION"]
          SHA256 = os.environ["SHA256"]

          # 首次发布时 tap 里还没有 formula：用完整模板渲染。
          TEMPLATE = """class Sag < Formula
            desc "Smart AI Gateway"
            homepage "https://github.com/rainbowatcher/sag"
            url "https://github.com/rainbowatcher/sag/releases/download/v__VERSION__/sag-v__VERSION__-aarch64-apple-darwin.tar.gz"
            sha256 "__SHA256__"
            version "__VERSION__"

            livecheck do
              url :stable
              strategy :github_releases
            end

            def install
              bin.install "sag"
            end

            service do
              run [opt_bin/"sag", "--config", etc/"sag/gateway.toml"]
              keep_alive true
              log_path var/"log/sag.log"
              error_log_path var/"log/sag.log"
            end

            def caveats
              <<~EOS
                sag 需要 gateway.toml 配置文件（查找顺序: --config > CWD > XDG config）。
                使用 `brew services start sag` 前，先创建:
                  $(brew --prefix)/etc/sag/gateway.toml
              EOS
            end

            test do
              # 二进制只解析 --config（没有 --version / --help），
              # 因此只断言已安装的 sag 可执行。
              assert_predicate bin/"sag", :executable?
            end
          end
          """


          def request(method, url, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8") or "null")
              except urllib.error.HTTPError as err:
                  raw = err.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw or "null")
                  except json.JSONDecodeError:
                      parsed = raw
                  return err.code, parsed


          def render_template():
              return TEMPLATE.replace("__VERSION__", VERSION).replace("__SHA256__", SHA256)


          def update_existing(current):
              # 只改三处，其余（desc / homepage / service / test 等 tap 侧维护的
              # 内容）原样保留。每处都必须恰好命中一次：先用 findall 做多重性守卫，
              # 命中多个（例如 tap 侧新增第二个 target 块）时 fail loudly，而不是
              # 静默只改第一处；命中为零则说明模板漂移。
              version_re = re.compile(r'(?m)^(\s*version\s+")[^"]*(")')
              version_matches = version_re.findall(current)
              if len(version_matches) != 1:
                  sys.exit(
                      f"::error::expected exactly 1 `version` line in the tap formula, "
                      f"found {len(version_matches)} — multi-target tap needs an "
                      f"explicit per-target update"
                  )
              updated = version_re.sub(rf'\g<1>{VERSION}\g<2>', current, count=1)

              url_re = re.compile(
                  r'(releases/download/)v[^/]+(/sag-v)[^/"]+(-aarch64-apple-darwin\.tar\.gz)'
              )
              url_matches = url_re.findall(updated)
              if len(url_matches) != 1:
                  sys.exit(
                      f"::error::expected exactly 1 url version segment in the tap formula, "
                      f"found {len(url_matches)} — multi-target tap needs an "
                      f"explicit per-target update"
                  )
              updated = url_re.sub(rf'\g<1>v{VERSION}\g<2>{VERSION}\g<3>', updated, count=1)

              sha_re = re.compile(r'(?m)^(\s*sha256\s+")[^"]*(")')
              sha_matches = sha_re.findall(updated)
              if len(sha_matches) != 1:
                  sys.exit(
                      f"::error::expected exactly 1 `sha256` line in the tap formula, "
                      f"found {len(sha_matches)} — multi-target tap needs an "
                      f"explicit per-target update"
                  )
              updated = sha_re.sub(rf'\g<1>{SHA256}\g<2>', updated, count=1)
              return updated


          status, body = request("GET", API)
          if status == 404:
              print(f"tap formula not found — creating {os.environ['TAP_PATH']} (first release)")
              content = render_template()
              payload = {
                  "message": f"sag {VERSION}",
                  "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
              }
          elif status == 200:
              print(f"tap formula found — updating {os.environ['TAP_PATH']} in place")
              content = update_existing(base64.b64decode(body["content"]).decode("utf-8"))
              payload = {
                  "message": f"sag {VERSION}",
                  "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                  # 乐观锁：sha 不匹配则 PUT 返回 409，不会覆盖他人并发改动。
                  "sha": body["sha"],
              }
          else:
              sys.exit(f"::error::unexpected GitHub API status {status} for GET {API}: {body}")

          print(f"--- {os.environ['TAP_PATH']} ---")
          print(content, end="")

          put_status, put_body = request("PUT", API, payload)
          if put_status not in (200, 201):
              sys.exit(f"::error::failed to write {os.environ['TAP_PATH']} (status {put_status}): {put_body}")
          commit = put_body.get("commit") or {}
          print(f"tap updated: {commit.get('html_url', '(no commit url)')}")
          PY
